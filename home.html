<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payoo | Home</title>
    <link rel="shortcut icon" href="/assets/logo.png" type="image/x-icon" />

    <!-- Tailwind + DaisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- icons  -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <style>
      * {
        font-family: "Outfit", sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen max-w-md mx-auto bg-base-200">
    <!-- Home page Header section -->
    <header
      class="logo border-b-2 border-gray-300 sticky top-0 bg-base-200 z-10"
    >
      <div class="py-8 w-11/12 mx-auto flex justify-between items-center">
        <div class="left w-17 flex justify-between gap-2">
          <img src="assets/logo.png" alt="" />
          <div class="balance-div">
            <h2 class="text-2xl font-bold">$<span id="balance">4500</span></h2>
            <p class="text-neutral/50 w-32">Available Balance</p>
          </div>
        </div>
        <div class="right">
          <a href="/index.html" class="btn btn-soft">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>LogOut</a
          >
        </div>
      </div>
    </header>

    <!-- Payoo section -->
    <div class="bg-white">
      <section class="w-11/12 mx-auto py-10 space-y-3">
        <h1 class="text-3xl font-bold">
          Welcome to Pay<span class="text-primary">oo</span>
        </h1>
        <p class="text-neutral/50">
          Enjoy easy and convenient financial services with us. Cashout charge
          is low and
        </p>
        <div class="buttons grid grid-cols-3 gap-3 py-10">
          <button class="btn btn-primary btn-soft flex-col h-full py-4">
            <img src="assets/opt-1.png" alt="" />
            <p>Add Money</p>
          </button>
          <button class="btn btn-primary btn-soft flex-col h-full py-4">
            <img src="assets/opt-2.png" alt="" />
            <p>Cashout</p>
          </button>
          <button class="btn btn-primary btn-soft flex-col h-full py-4">
            <img src="assets/opt-3.png" alt="" />
            <p>Send Money</p>
          </button>
          <button class="btn btn-primary btn-soft flex-col h-full py-4">
            <img src="assets/opt-4.png" alt="" />
            <p>Get Bonus</p>
          </button>
          <button class="btn btn-primary btn-soft flex-col h-full py-4">
            <img src="assets/opt-5.png" alt="" />
            <p>Pay Bill</p>
          </button>
          <button class="btn btn-primary btn-soft flex-col h-full py-4">
            <img src="assets/opt-6.png" alt="" />
            <p>Transaction</p>
          </button>
        </div>
      </section>
    </div>
    <!-- CashOut form -->
    <section class="w-11/12 mx-auto py-3">
      <h1 class="text-3xl font-bold py-5">CashOut</h1>
      <div class="card bg-base-100 w-full shadow rounded-2xl mx-auto">
        <div class="card-body">
          <fieldset class="fieldset">
            <label class="label font-semibold text-lg text-neutral/70"
              >Agent Number</label
            >
            <input
              type="text"
              id="agent-number"
              class="input rounded-full w-full bg-base-200 border-none"
              maxlength="11"
              minlength="11"
              placeholder="Enter Agent Number"
            />
            <br />
            <label class="label font-semibold text-lg text-neutral/70"
              >Amount</label
            >
            <input
              type="number"
              id="amount"
              class="input rounded-full w-full bg-base-200 border-none"
              placeholder="Enter Amount"
            />
            <br />
            <label class="label font-semibold text-lg text-neutral/70"
              >Pin Number</label
            >
            <input
              type="password"
              id="cashout-pin"
              class="input rounded-full w-full bg-base-200 border-none"
              maxlength="4"
              placeholder="Enter 4 Digit Pin"
            />

            <button id="cashout" class="btn btn-primary rounded-full mt-4">
              Withdraw
            </button>
          </fieldset>
        </div>
      </div>
    </section>
    <script src="scripts/common.js"></script>
    <script src="scripts/cashout.js"></script>
  </body>
</html>
