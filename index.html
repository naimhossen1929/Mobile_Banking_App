<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payoo | Login</title>
    <link rel="shortcut icon" href="/assets/logo.png" type="image/x-icon" />

    <!-- Tailwind + DaisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- icons  -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <style>
      * {
        font-family: "Outfit", sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen max-w-md mx-auto bg-base-200">
    <div class="logo w-75 mx-auto pt-36">
      <img src="assets/Logo-full.png" alt="" />
    </div>
    <div class="login-form pt-10">
      <div
        class="card bg-base-100 w-full max-w-sm shrink-0 shadow rounded-2xl mx-auto"
      >
        <div class="card-body">
          <fieldset class="fieldset">
            <label class="label font-bold text-neutral text-lg"
              >Mobile Number</label
            >
            <input
              type="text"
              id="number-input"
              class="input rounded-full bg-base-200 border-none"
              value="01234567899"
              maxlength="11"
              minlength="11"
              placeholder="Enter your 11 digit Number"
            />
            <br />
            <label class="label font-bold text-lg text-neutral"
              >4 Digit Pin</label
            >
            <input
              type="password"
              id="input-pin"
              class="input rounded-full bg-base-200 border-none"
              maxlength="4"
              placeholder="Enter 4 Digit Pin"
            />

            <button
              id="login-btn"
              class="btn btn-primary text-lg rounded-full mt-4"
            >
              LogIn
            </button>
          </fieldset>
        </div>
      </div>
    </div>
    <script src="scripts/login.js"></script>
  </body>
</html>
